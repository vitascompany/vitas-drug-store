<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VITAS Drug Store</title>
    <meta
      name="description"
      content="Authorized distributors of medicines, medical supplies, cosmetics and pharmaceuticals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="brand-wrap">
        <div class="logo-block" aria-label="VITAS logo">
          <div class="capsule">
            <div class="capsule-top"></div>
            <div class="capsule-bottom"></div>
            <div class="ecg">
              <span></span>
            </div>
          </div>
        </div>

        <div class="brand-copy">
          <h1 class="brand-title">VITAS<span class="reg">®</span></h1>
          <div class="brand-sub">DRUG STORE</div>
        </div>
      </div>

      <div class="main-copy">
        <p class="lead">
          Authorized Distributors Of Medicines, Medical Supplies , cosmetics And
          Pharmaceuticals .
        </p>
      </div>

      <div class="contact-layout">
        <div class="contact-list">
          <div class="row location-row">
            <span class="icon icon-pin" aria-hidden="true"></span>
            <span class="text">Aleppo - Saif AL Douleh.</span>
          </div>

          <div class="row divider"></div>

          <div class="row email-row">
            <span class="icon icon-mail" aria-hidden="true"></span>
            <span class="text">vitasmedaleppo@gmail.com</span>
          </div>

          <div class="row register-row">
            <span class="icon icon-reg" aria-hidden="true"></span>
            <span class="text">commercial register # 95812</span>
          </div>

          <div class="row divider"></div>

          <div class="row title-row">
            <span class="icon icon-building" aria-hidden="true"></span>
            <span class="text">Managed By :</span>
          </div>

          <div class="row manager-row">
            <span class="person-name">IBRAHIM AL HAMAD</span>
            <span class="phone-wrap">
              <span class="icon-phone"></span>
              <span>0940040430</span>
            </span>
          </div>

          <div class="row manager-row">
            <span class="person-name">ZOHAIR AL HAMAD</span>
            <span class="phone-wrap">
              <span class="icon-phone"></span>
              <span>0940040431</span>
            </span>
          </div>
        </div>

        <div class="brand-mark" aria-hidden="true">
          <div class="pulse-mark"></div>
        </div>
      </div>
    </div>
  </body>
</html>
